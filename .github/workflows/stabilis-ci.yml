name: Stabilis Quality Gate

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.html'
      - 'login.html'
      - 'operator-intelligence.html'
      - 'operator-intelligence-report.html'
      - 'security.html'
      - 'privacy.html'
      - 'terms.html'
      - 'assets/**'
      - 'netlify/**'
      - 'operator-intelligence/**'
      - '_redirects'
      - 'netlify.toml'
      - 'stabilis-config.js'
      - 'stabilis-release-marker.txt'
      - '.github/workflows/stabilis-ci.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'login.html'
      - 'operator-intelligence.html'
      - 'operator-intelligence-report.html'
      - 'security.html'
      - 'privacy.html'
      - 'terms.html'
      - 'assets/**'
      - 'netlify/**'
      - 'operator-intelligence/**'
      - '_redirects'
      - 'netlify.toml'
      - 'stabilis-config.js'
      - 'stabilis-release-marker.txt'
      - '.github/workflows/stabilis-ci.yml'

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: operator-intelligence/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[test,dev]"
      - name: Generate deterministic Harbor & Hearth fixtures
        run: python scripts/generate_dataset.py
      - name: Full ingestion-to-report pipeline smoke
        run: |
          mkdir -p outputs
          python scripts/run_analysis.py > outputs/ci-pipeline-smoke.json
          test -s outputs/validation.json
          test -s outputs/findings.json
          test -s outputs/opportunities_counted.json
          test -s outputs/priorities.json
          test -s outputs/scores.json
          test -s outputs/operator_intelligence_report.md
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('outputs/ci-pipeline-smoke.json').read_text())
          assert round(float(payload['recoverable_total']),2)==392570.56, payload['recoverable_total']
          PY
      - name: Unit, integration, financial and release contract tests
        run: pytest -q
      - name: Compile check
        run: python -m compileall -q src scripts tests
      - name: JavaScript syntax check
        working-directory: .
        run: |
          node --check assets/public.js
          node --check assets/demo-data.js
          node --check assets/demo.js
          node --check assets/app.js
          node --check assets/app-modules.js
          node --check assets/ask-stabilis.js
      - name: Static production build contract
        working-directory: .
        run: |
          test -s index.html
          test -s operator-intelligence.html
          test -s operator-intelligence-report.html
          test -s login.html
          test -s app.html
          test -s security.html
          test -s privacy.html
          test -s terms.html
          test -s assets/stabilis.css
          test -s assets/app-modules.js
          test -s assets/ask-stabilis.js
          test -s netlify/functions/_stabilis-ai-core.mts
          test -s netlify/functions/ask-stabilis.mts
          test -s netlify/functions/stabilis-ai-health.mts
          test -s netlify/functions/stabilis-golden-eval.mts
          test -s operator-intelligence/evals/ask_stabilis_golden_v1.json
          test -s operator-intelligence/evals/harbor_hearth_eval_context_v1.json
          test -s operator-intelligence/scripts/run_live_eval.py
          test -s operator-intelligence/scripts/validate_live_eval.py
          test -s operator-intelligence/supabase/migrations/20260902003000_ask_stabilis_telemetry_hardening.sql
          test -s stabilis-release-marker.txt
      - name: Lint
        run: ruff check src scripts tests
      - name: Type check core calculation and security modules
        run: mypy src/application/security.py src/application/fiscal.py src/scoring/confidence.py src/scoring/priority.py src/metrics/engine.py
      - name: Install Chromium for browser release QA
        run: python -m playwright install --with-deps chromium
      - name: Netlify deploy-preview browser QA
        if: github.event_name == 'pull_request'
        env:
          STABILIS_RELEASE_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--stabilis-ops-group.netlify.app
          STABILIS_EXPECT_RELEASE_MARKER: stabilis-operator-intelligence-10x-20260901
        run: |
          python scripts/release_preview_qa.py
          python scripts/ask_stabilis_preview_qa.py
      - name: Netlify production browser QA
        if: github.event_name == 'push'
        env:
          STABILIS_RELEASE_BASE_URL: https://stabilis-ops-group.netlify.app
          STABILIS_EXPECT_RELEASE_MARKER: stabilis-operator-intelligence-10x-20260901
        run: |
          python scripts/release_preview_qa.py
          python scripts/ask_stabilis_preview_qa.py
      - name: Live Ask Stabilis golden evaluation
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE="https://deploy-preview-${PR_NUMBER}--stabilis-ops-group.netlify.app"
          else
            BASE="https://stabilis-ops-group.netlify.app"
          fi
          mkdir -p outputs
          STABILIS_RELEASE_BASE_URL="$BASE" \
          STABILIS_GOLDEN_OUTPUT="outputs/ask-stabilis-live-eval.json" \
            python scripts/run_live_eval.py
          python scripts/validate_live_eval.py outputs/ask-stabilis-live-eval.json
      - name: Persist live evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ask-stabilis-live-eval-${{ github.event_name }}-${{ github.run_id }}
          path: operator-intelligence/outputs/ask-stabilis-live-eval.json
          if-no-files-found: warn
          retention-days: 90
