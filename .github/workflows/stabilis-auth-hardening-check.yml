name: Stabilis Auth Hardening Check

on:
  push:
    branches: [stabilis-observability-final-20260902]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-config:
    runs-on: ubuntu-latest
    steps:
      - name: Verify or enable leaked-password protection when authorized
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: vpunfmwklwjefvchvmpn
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_MANAGEMENT_TOKEN_PRESENT=false"
            exit 0
          fi
          echo "SUPABASE_MANAGEMENT_TOKEN_PRESENT=true"
          current=$(curl -fsS "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
          before=$(printf '%s' "$current" | python -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("password_hibp_enabled"))).lower())')
          echo "PASSWORD_HIBP_BEFORE=${before}"
          if [ "$before" != "true" ]; then
            curl -fsS -X PATCH "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"password_hibp_enabled":true}' >/dev/null
          fi
          verify=$(curl -fsS "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
          after=$(printf '%s' "$verify" | python -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("password_hibp_enabled"))).lower())')
          echo "PASSWORD_HIBP_AFTER=${after}"
          test "$after" = "true"
