name: Stabilis Auth Hardening Check

on:
  push:
    branches: [stabilis-observability-final-20260902]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-config:
    runs-on: ubuntu-latest
    steps:
      - name: Probe authorized Supabase control surfaces safely
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STABILIS_SUPABASE_SECRET_KEY: ${{ secrets.STABILIS_SUPABASE_SECRET_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: vpunfmwklwjefvchvmpn
        run: |
          set -euo pipefail
          echo "SUPABASE_MANAGEMENT_TOKEN_PRESENT=$([ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && echo true || echo false)"
          echo "SUPABASE_SERVICE_ROLE_PRESENT=$([ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && echo true || echo false)"
          echo "STABILIS_SUPABASE_SECRET_PRESENT=$([ -n "${STABILIS_SUPABASE_SECRET_KEY:-}" ] && echo true || echo false)"
          echo "SUPABASE_DB_PASSWORD_PRESENT=$([ -n "${SUPABASE_DB_PASSWORD:-}" ] && echo true || echo false)"
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            exit 0
          fi
          current=$(curl -fsS "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
          before=$(printf '%s' "$current" | python -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("password_hibp_enabled"))).lower())')
          echo "PASSWORD_HIBP_BEFORE=${before}"
          if [ "$before" != "true" ]; then
            curl -fsS -X PATCH "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"password_hibp_enabled":true}' >/dev/null
          fi
          verify=$(curl -fsS "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
          after=$(printf '%s' "$verify" | python -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("password_hibp_enabled"))).lower())')
          echo "PASSWORD_HIBP_AFTER=${after}"
          test "$after" = "true"
