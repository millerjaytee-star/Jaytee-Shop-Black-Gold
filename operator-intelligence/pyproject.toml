[project]
name = "stabilis-operator-intelligence"
version = "0.3.0"
description = "Verified operating intelligence and execution system for multi-unit operators"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
dev = ["ruff>=0.8", "mypy>=1.11"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "E9"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
