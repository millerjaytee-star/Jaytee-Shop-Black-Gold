[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://vpunfmwklwjefvchvmpn.supabase.co; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

[[redirects]]
  from = "/score"
  to = "/#score"
  status = 301

[[redirects]]
  from = "/diagnostic"
  to = "/#diagnostic"
  status = 301

[[redirects]]
  from = "/resources"
  to = "/resources.html"
  status = 200

[[redirects]]
  from = "/new-store-readiness"
  to = "/new-store-operational-readiness.html"
  status = 200

[[redirects]]
  from = "/off-premise-accuracy"
  to = "/off-premise-line-accuracy.html"
  status = 200

[[redirects]]
  from = "/kds-workflow"
  to = "/labor-kds-workflow.html"
  status = 200

[[redirects]]
  from = "/reset"
  to = "/profit-control-reset.html"
  status = 200
